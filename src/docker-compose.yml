services:
  postgres:
    # Official postgis/postgis is amd64-only; this tag publishes linux/arm64 (Apple Silicon).
    image: imresamu/postgis:16-3.5-bookworm
    container_name: prototype-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB_NAME:-prototype}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cluster:
    image: redis:7-alpine
    container_name: prototype-redis-cluster
    restart: unless-stopped
    ports:
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
      - "7006:7006"
      - "5540:5540"
    volumes:
      - redis_cluster_data:/data
      - ./redis-cluster-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 cluster info | grep -q cluster_state:ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: prototype-redisinsight
    network_mode: "service:redis-cluster"
    depends_on:
      redis-cluster:
        condition: service_healthy
    environment:
      RI_REDIS_HOST: 127.0.0.1
      RI_REDIS_PORT: 7001
      RI_REDIS_ALIAS: local-cluster
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: prototype-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cdn_cache:/var/cache/nginx/cdn
    command:
      - /bin/sh
      - -c
      - mkdir -p /var/cache/nginx/cdn && chown nginx:nginx /var/cache/nginx/cdn && nginx -g 'daemon off;'
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_cluster_data:
  redisinsight_data:
  nginx_cdn_cache:
