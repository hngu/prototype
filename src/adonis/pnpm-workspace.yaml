packages:
  - 'apps/*'

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3

# Only install versions published at least 4 days ago (in minutes), so a
# compromised release is likely caught and pulled before it reaches us.
minimumReleaseAge: 5760
