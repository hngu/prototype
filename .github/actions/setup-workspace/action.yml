name: Set up workspace
description: >
  Installs the Node version from .nvmrc and the pnpm version from the root
  packageManager field, then installs the workspace with a frozen lockfile.

# Every `uses:` below is pinned to a full commit SHA, with the tag in a trailing
# comment. This repository quarantines npm dependencies for seven days
# (`minimumReleaseAge` in pnpm-workspace.yaml) and blocks install scripts by
# default; a floating `@v7` tag would be the same supply-chain hole in a different
# registry, since tags are mutable. Chosen versions were also checked to be more
# than seven days old, for consistency with that policy — which is why
# pnpm/action-setup is v6.0.9 rather than the v6.0.10 published five days before
# this was written.
#
# To update: `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`, and check
# `gh api repos/<owner>/<repo>/releases/tags/<tag> --jq .published_at` is aged.

runs:
  using: composite
  steps:
    # Do not restore .tool-versions. Cloudflare Pages (and Workers builds)
    # treat that file as an asdf manifest and try to install every tool listed
    # — including pnpm, whose asdf plugin is not on the Pages image — so the
    # deploy fails before the build command runs. Pin Node in .nvmrc (Pages,
    # Netlify, Vercel, and actions/setup-node all read it) and pnpm in
    # package.json#packageManager (pnpm/action-setup and Corepack read it).
    # Neither file trips the asdf installer.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # --frozen-lockfile fails if pnpm-lock.yaml does not match the manifests,
    # which is what makes CI catch a dependency added without committing the lock.
    - shell: bash
      run: pnpm install --frozen-lockfile
